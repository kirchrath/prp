; ESP32 barcode scanner for the home inventory
;   build:  pio run -e esp32dev          flash: pio run -e esp32dev -t upload
;   tests:  pio test -e native           (hardware independent logic in lib/scanner_logic)

[platformio]
default_envs = esp32dev

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DFIRMWARE_VERSION=\"0.2.0\"
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    ${env.lib_deps}
    tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
