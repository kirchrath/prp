; ESP32 barcode scanner for the home inventory
; build:  pio run          flash: pio run -t upload          log: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DFIRMWARE_VERSION=\"0.1.0\"
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
