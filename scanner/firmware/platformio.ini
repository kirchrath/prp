; ESP32 devices for the home inventory
;   barcode scanner:  pio run -e esp32dev          flash: pio run -e esp32dev -t upload
;   button box:       pio run -e buttons           flash: pio run -e buttons -t upload
;   tests:            pio test -e native           (hardware independent logic in lib/scanner_logic)

[platformio]
default_envs = esp32dev

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DFIRMWARE_VERSION=\"0.2.0\"
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    ${env.lib_deps}
    tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8
build_src_filter = +<*> -<buttons/>

; button box: up to 8 buttons, each books one unit of a fixed article (short press in, long press out)
[env:buttons]
extends = env:esp32dev
build_flags =
    -DFIRMWARE_VERSION=\"0.1.0\"
    -DDEVICE_ID_PREFIX=\"knopf\"
    -DCORE_DEBUG_LEVEL=1
build_src_filter = +<*> -<scanner/>

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
