spring:
  application:
    name: inventory-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer as seen by the browser (claim "iss" in the token)
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/home}
          # keys are fetched container-internally from Keycloak
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/home/protocol/openid-connect/certs}

inventory:
  security:
    enabled: ${SECURITY_ENABLED:true}
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    url: ${MQTT_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:inventory-backend}
    username: ${MQTT_USERNAME:inventory-backend}
    password: ${MQTT_PASSWORD:}
    topic-prefix: ${MQTT_TOPIC_PREFIX:inventory/scanner}
  lookup:
    enabled: ${LOOKUP_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
