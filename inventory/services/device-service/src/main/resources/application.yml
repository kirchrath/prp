spring:
  application:
    name: device-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventory}
    hikari:
      # every service owns its own schema
      schema: device
  flyway:
    schemas: device
    default-schema: device
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # firmware images (min_spiffs OTA partition: 1.875 MB)
      max-file-size: 4MB
      max-request-size: 4MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: device-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/home}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/home/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

device:
  mqtt:
    url: ${MQTT_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:device-service}
    username: ${MQTT_USERNAME:device-service}
    password: ${MQTT_PASSWORD:}
    topic-prefix: ${MQTT_TOPIC_PREFIX:inventory/scanner}
  ota:
    # firmware download server for the devices (http://<docker host>:<port>/ota/<token>)
    port: ${OTA_PORT:8088}
    # time a device has to download and install an update
    token-validity: 15m
